[package]
name = "crowndock"
version = "0.1.0"
edition = "2024"

[dependencies]
crownshell = { git = "https://github.com/crown-os/crownshell" }

anyhow = "1.0.102"
log = "0.4"
env_logger = "0.11"
tracing = "0.1.44"

vello = "0.9.0"
smithay-client-toolkit = { version = "0.19", features = ["calloop"] }

tiny-skia = "0.11"
usvg = "0.43"
resvg = "0.43"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
  "bmp",
] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "5"
freedesktop_entry_parser = "1.3"
freedesktop-icons = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
