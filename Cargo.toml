[package]
name = "crowndock"
version = "0.1.0"
edition = "2024"

[dependencies]
crownui = { path = "../crownui/crownui", default-features = false, features = ["wayland", "impeller", "static", "tokio"] }
crownconfig = { path = "../crownui/crownconfig" }
motion = { path = "../crownui/motion" }

anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "time"] }

freedesktop_entry_parser = "1.3"
freedesktop-icons = "0.4"
resvg = { version = "0.48", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
crowntest = { path = "../crownui/crowntest" }
ron = "0.12"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
